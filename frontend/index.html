<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum-scale="1.0">
    <title>Einkaufsliste</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="icon" type="image/png" href="static/shopping-card.png">
</head>
<body>
    
<header>
    <span>🛒</span>
    <h1>Einkaufsliste</h1>
        <button class="btn btn-icon" onclick="openTagManager()" id="tag-manager-btn" title="Tags verwalten">🏷️</button>
        <button class="btn btn-icon" onclick="toggleDarkMode()" id="dark-toggle" title="Dark Mode">🌙</button>
        <img src="static/DHGE.png" alt="Logo" class="header-logo">
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <input type="text" id="new-list-input" placeholder="Neue Liste..."/>
            <button class="btn btn-primary" onclick="createList()">+</button>
        </div>
        <div class="lists-container" id="lists-container">
            <div class="empty-state">
                <p>Keine Listen vorhanden</p>
            </div>
        </div>
    </aside>

    <main class="main" id="main-panel">
        <div class="empty-state" style="margin:auto;">
            <div class="icon">👈</div>
            <p>Wähle eine Liste aus oder erstelle eine neue.</p>
        </div>
    </main>
</div>

<div id="tag-manager-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center;">
    <div style="background: var(--surface); border-radius: var(--radius); padding: 24px; width: 340px; max-width: 90vw;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <h2 style="font-size: 16px; font-weight: 600;">Tags verwalten</h2>
            <button class="btn btn-icon" onclick="closeTagManager()">✕</button>
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="text" id="new-tag-name" placeholder="Tag-Name ..." style="flex: 1" onkeydown="if(event.key==='Enter') createTag()"/>
            <input type="color" id="new-tag-color" value="#3b6b3a" style="width: 36px; height: 36px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;" />
            <button class="btn btn-primary" onclick="createTag()">+</button>
        </div>
        <div id="tag-manager-list"></div>
    </div>
</div>


<footer>
    <span>Erstellt von Franz Krätzer, Neo Simmerling &amp; Luke Treder</span>
</footer>

<script src="static/app.js"></script>

</body>
</html>
