version: "3.8"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shopdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  api:
    build: .
    container_name: fastapi_app
    depends_on:
      - db
    ports:
     - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/shopdb

volumes:
  postgres_data: